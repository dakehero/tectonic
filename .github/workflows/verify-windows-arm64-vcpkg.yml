name: "Verify Windows ARM64 vcpkg"

on:
  push:
    branches:
      - verify-windows-arm64-vcpkg-ci
  workflow_dispatch:

jobs:
  prep:
    uses: ./.github/workflows/prep.yml

  windows-arm64-vcpkg:
    needs: prep
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: "Generic Setup"
        uses: ./.github/actions/build-setup
        with:
          toolchain: stable
      - name: "Setup vcpkg build variables"
        shell: bash
        run: |
          echo "TECTONIC_DEP_BACKEND=vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/target/vcpkg" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Ctarget-feature=+crt-static" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=arm64-windows-static-release" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows-static-release" >> "$GITHUB_ENV"
      - name: "Install vcpkg dependencies"
        uses: ./.github/actions/vcpkg-deps
        with:
          target: aarch64-pc-windows-msvc
      - name: "Build and package"
        uses: ./.github/actions/build-and-test
        with:
          target: aarch64-pc-windows-msvc
          run-tests: 'false'
          publish: 'true'
